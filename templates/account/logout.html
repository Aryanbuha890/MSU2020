{% extends "base.html" %}

{% block title %}Sign Out{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm mt-10">
  <h1 class="mb-6 text-2xl font-bold text-slate-900">Sign Out</h1>
  
  <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <p class="mb-6 text-sm text-slate-700">Are you sure you want to sign out?</p>
    
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
      {% endif %}
      
      <div class="flex gap-3">
        <button type="submit" class="flex-1 rounded-lg bg-emerald-700 py-2.5 font-bold text-white hover:bg-emerald-800 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
          Sign Out
        </button>
        <a href="javascript:history.back()" class="flex-1 rounded-lg border border-slate-300 bg-white py-2.5 text-center font-bold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
